  - type: Registration
    url: https://www.hampdenbank.com/tpp-registration
- aid: hampden-and-co:hampden-and-co-payment-initiation-api
  name: Hampden & Co Payment Initiation API
  description: OBIE Read/Write Payment Initiation Service (PIS) - domestic, scheduled,
    standing-order, international, and file payments - as a FAPI-secured PSD2 dedicated
    interface. The harvested OpenAPI is the shared OBIE Read/Write standard (v4.0.1),
    not a Hampden-proprietary contract; production access requires TPP onboarding with
    eIDAS/OBIE certificates and PSD2 strong customer authentication.
  humanURL: https://developer-sandbox.hampdendigital.com/
