apis:
- aid: hampden-and-co:hampden-and-co-open-data-api
  name: Hampden & Co Open Data API
  description: Public, unauthenticated Open Data reference API conforming to the OBIE
    UK Open Banking Open Data standard (product reference data such as personal and
    business current accounts). Listed on Hampden & Co's Open Banking register entry;
    a live Open Data endpoint could not be independently confirmed at bootstrap (the
    developer portal is a single-page app that returns HTML for all paths), so the
    surface is represented from documentation rather than a verified base URL.
  humanURL: https://developer-sandbox.hampdendigital.com/
  baseURL: https://developer-sandbox.hampdendigital.com
  tags:
  - Open Data
  - Reference Data
  properties:
  - type: Documentation
    url: https://developer-sandbox.hampdendigital.com/home
  - type: Registration
    url: https://www.openbanking.org.uk/regulated-providers/hampden-co-plc/
- aid: hampden-and-co:hampden-and-co-account-information-api
  name: Hampden & Co Account & Transaction Information API
  description: OBIE Read/Write Account Information Service (AIS) - accounts, balances,
    transactions, beneficiaries, standing orders, direct debits, statements, and
    parties - as a FAPI-secured PSD2 dedicated interface. The harvested OpenAPI is the
    shared OBIE Read/Write standard (v4.0.1), not a Hampden-proprietary contract;
    production access requires TPP onboarding with eIDAS/OBIE certificates.
  humanURL: https://developer-sandbox.hampdendigital.com/
  baseURL: https://developer-sandbox.hampdendigital.com
  tags:
  - Account Information
  - AIS
