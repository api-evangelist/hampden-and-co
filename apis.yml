- aid: hampden-and-co:hampden-and-co-confirmation-of-funds-api
  name: Hampden & Co Confirmation of Funds API
  description: OBIE Read/Write Confirmation of Funds Service (CBPII) allowing an
    authorised card-based payment instrument issuer to confirm the availability of
