aid: hampden-and-co
url: https://raw.githubusercontent.com/api-evangelist/hampden-and-co/refs/heads/main/apis.yml
name: Hampden & Co
kind: company
description: >-
  Hampden & Co (trading as Hampden Bank since March 2024) is an independent
  UK private bank headquartered at 20/21 Charlotte Square, Edinburgh, with offices in
  London and Manchester, serving high-net-worth individuals, their families, and their
  businesses with day-to-day banking, deposits, and specialist lending. Incorporated
  in 2010 as "Scoban" and launched in 2015, it was the first newly created UK private
  bank in three decades; it is a shareholder-owned public limited company (SC386922) -
  not a mutual or building society - backed by cornerstone shareholders and hundreds
  of smaller investors, and passed £1 billion in deposits in 2025. It is authorised by
  the Prudential Regulation Authority and regulated by the Financial Conduct Authority
  and the PRA. Although not one of the CMA9 mandated banks, Hampden & Co is an
  FCA-authorised ASPSP registered with the Open Banking Implementation Entity (OBIE)
  and exposes a PSD2 dedicated interface: an Open Data reference API plus the OBIE
  Read/Write family (Account & Transaction Information, Payment Initiation, and
  Confirmation of Funds), onboarded through a developer sandbox portal and secured with
  FAPI-grade OAuth2/OIDC, mutual-TLS, PSD2 strong customer authentication, and eIDAS/OBIE
  certificate-based dynamic client registration.
